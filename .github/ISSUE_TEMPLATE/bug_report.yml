name: Bug report
description: Something in the port does not work as it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please do **not** attach game files, decrypted binaries, saves or keys: only logs and screenshots. The port is only partly playable and runs slowly, so check [docs/KNOWN_ISSUES.md](https://github.com/undecuple/project-pyrrhus/blob/main/docs/KNOWN_ISSUES.md) first; report what is different from it and from the README's status table.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options: ["1.29 (update installed)", "1.01 (disc only)", "Not sure"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port build
      description: "Release number, or the commit (`git rev-parse --short HEAD`) of the build you ran."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (Windows version, or Linux distribution and Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: level
    attributes:
      label: Chapter or menu
      description: "Which chapter or menu, and how long after the start."
  - type: textarea
    id: logs
    attributes:
      label: Support package or log files
      description: "Best: attach a support package. Choose \"Make a support package\" in the Start menu (in a portable folder, run Project Pyrrhus.exe --support-package there): it puts the logs, crash reports and settings in one zip in the logs folder, with your user folders and PC name already replaced. If you cannot make one, attach the newest log from build\\logs (and a crash-*.txt there, if any) after opening it and removing your Windows or Linux user name, home folder paths and PC name yourself. Never attach game files, decrypted binaries, saves or keys."
